

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قلب متجرك</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff5f7;
      font-family: Arial, sans-serif;
    }

    .heart {
      width: 280px;
      filter: drop-shadow(0 10px 18px #e84a6a55);
    }

    .heart text {
      fill: white;
      font-size: 30px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>
  <svg class="heart" viewBox="0 0 300 280" role="img" aria-label="قلب متجرك">
    <path
      fill="#e84a6a"
      d="M150 265
         C130 245 20 165 20 88
         C20 25 100 8 150 70
         C200 8 280 25 280 88
         C280 165 170 245 150 265Z"
    />
    <text x="150" y="130" direction="rtl">متجرك</text>
  </svg>
</body>
</html>
